name: Ingest TMDB data

on:
  schedule:
    # Daily, off the hour to avoid the top-of-hour GitHub Actions congestion. Daily (not
    # weekly) matters here: buildSchedule always generates "the next 7 days from today",
    # so a stale run would let today's showtimes quietly fall off the front of the window.
    - cron: "17 8 * * *"
  workflow_dispatch: {}

# A second ingest.yml run starting before the first finishes committing would race on
# packages/snapshot — never worth parallelizing this, so queue rather than cancel-and-lose
# whichever run was about to write.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=@screen-yield/pricing
      - run: npm run build --workspace=@screen-yield/schema
      - name: Run ingest
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run ingest --workspace=@screen-yield/etl
      - name: Commit updated snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/snapshot
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "chore: refresh TMDB snapshot [skip ci]"
          git push
